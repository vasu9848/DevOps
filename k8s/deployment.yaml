apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: web-app
        image: DOCKER_HUB_USERNAME/sample-app:IMAGE_TAG
        ports:
        - containerPort: 3000

